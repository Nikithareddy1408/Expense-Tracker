<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track what you spend, see where it goes.</p>
    </header>

    <main class="layout">
      <section class="card" aria-labelledby="add-expense-heading">
        <h2 id="add-expense-heading">Add an expense</h2>
        <form id="expense-form" novalidate>
          <div class="field">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required />
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required></select>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="field">
            <label for="note">Note <span class="optional">(optional)</span></label>
            <input type="text" id="note" name="note" placeholder="e.g. Groceries at Trader Joe's" maxlength="200" />
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>

          <button type="submit">Add expense</button>
        </form>
      </section>

      <section class="card summary-card" aria-labelledby="summary-heading">
        <h2 id="summary-heading">Summary</h2>
        <div class="stat-tile">
          <span class="stat-label">Total spending</span>
          <span class="stat-value" id="total-spending">$0.00</span>
        </div>

        <div class="chart-wrap">
          <canvas id="category-chart" height="220" role="img" aria-label="Bar chart of spending by category"></canvas>
          <p id="chart-empty" class="empty-state" hidden>No expenses yet — add one to see the breakdown.</p>
        </div>

        <table class="breakdown-table" id="breakdown-table">
          <caption class="sr-only">Spending by category</caption>
          <thead>
            <tr>
              <th scope="col">Category</th>
              <th scope="col">Total</th>
            </tr>
          </thead>
          <tbody id="breakdown-body"></tbody>
        </table>
      </section>

      <section class="card list-card" aria-labelledby="list-heading">
        <h2 id="list-heading">All expenses</h2>
        <p id="list-empty" class="empty-state" hidden>No expenses recorded yet.</p>
        <ul class="expense-list" id="expense-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
